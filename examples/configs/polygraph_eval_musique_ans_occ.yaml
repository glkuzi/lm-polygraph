:hydra:
  run:
    dir: ${cache_path}/${task}/${model.path}/${dataset}/${now:%Y-%m-%d}/${now:%H-%M-%S}

defaults:
  - model: gemma_3_1b
  - estimators: default_estimators_unsup
  - stat_calculators: default_calculators
  - _self_

cache_path: ./workdir/output
save_path: '${hydra:run.dir}'
instruct: false
task: qa

dataset: ['AIRI-NLP/musique_ans_occ']
text_column: prompt
label_column: answers
train_split: null
eval_split: eval
max_new_tokens: 30
load_from_disk: false
multiref: true
trust_remote_code: false
size: 2000
generation_params:
  temperature: 1.0
  top_p: 0.95
  top_k: 64
  stop_strings:
    - "\n"

subsample_eval_dataset: 2000

generation_metrics: null

ignore_exceptions: false

batch_size: 1

seed:
    - 1
