hydra:
  run:
    dir: ${cache_path}/${task}/${model}/${dataset}/${now:%Y-%m-%d}/${now:%H-%M-%S}

defaults:
  - model: gemma_3
  - estimators: default_estimators_no_focus
  - stat_calculators: default_calculators
  - _self_

cache_path: ./workdir/output
save_path: '${hydra:run.dir}'
instruct: true
task: qa

dataset: '/home/jovyan/gkuzmin/mental_health/kl_data/ked_hf:validation'
text_column: text
label_column: label
train_split: train
eval_split: validation
max_new_tokens: 5
load_from_disk: true
multiref: false
trust_remote_code: false
size: 10000
generation_params:
  stop_strings:
    - "\n"

subsample_eval_dataset: -1

generation_metrics: null

ignore_exceptions: false

batch_size: 2

seed:
    - 1
