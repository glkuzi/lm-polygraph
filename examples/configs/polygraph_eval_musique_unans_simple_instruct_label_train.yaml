hydra:
  run:
    dir: ${cache_path}/${task}/${model.path}/${dataset}/${now:%Y-%m-%d}/${now:%H-%M-%S}

defaults:
  - model: gemma_3_1b
  - estimators: default_estimators_base_only
  - stat_calculators: default_calculators
  - _self_

cache_path: ./workdir/output
save_path: '${hydra:run.dir}'
instruct: true
task: qa

dataset: ['AIRI-NLP/musique_unans']
text_column: prompt
label_column: all_answers
train_split: train
eval_split: train
max_new_tokens: 50
load_from_disk: false
multiref: true
trust_remote_code: false
size: 10000
generation_params:
  stop_strings:
    - "\n"

subsample_eval_dataset: -1

generation_metrics: null

ignore_exceptions: false

batch_size: 1

seed:
    - 1
